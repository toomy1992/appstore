services:
  media:
    image: alpine/git:2.54.0
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/media/img:/out/img
      - ${APP_DATA_DIR}/media/gif:/out/gif
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if ! ls /out/img/*.jpg >/dev/null 2>&1; then
          echo "Downloading exercise media (~140 MB, one time)…"
          echo "Source: github.com/hasaneyldrm/exercises-dataset"
          echo "Images and animations are third-party content; see NOTICE.md upstream."
          git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
          mkdir -p /out/img /out/gif
          cp /tmp/ds/images/*.jpg /out/img/
          cp /tmp/ds/videos/*.gif /out/gif/
          echo "Exercise media ready."
        else
          echo "Exercise media already present — skipping download."
        fi

  api:
    image: registry.gitlab.com/duartesantos8/opengym/api:1.2.14
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATA_DIR: /data
      RP_ID: ${OPENGYM_RP_ID:-localhost}
      ORIGIN: ${OPENGYM_ORIGIN:-http://localhost:8088}
      RP_NAME: ${OPENGYM_RP_NAME:-openGym}
      SESSION_DAYS: ${OPENGYM_SESSION_DAYS:-90}
      ALLOW_GUEST: ${OPENGYM_ALLOW_GUEST:-true}
      INVITE_ONLY: ${OPENGYM_INVITE_ONLY:-false}
      ADMIN_UIDS: ${OPENGYM_ADMIN_UIDS:-}
      TZ: ${TZ}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  web:
    image: registry.gitlab.com/duartesantos8/opengym/web:1.2.14
    restart: unless-stopped
    environment:
      NGINX_PORT: "80"
      BACKEND: api
      PORT: "3000"
    volumes:
      - ${APP_DATA_DIR}/media/img:/usr/share/nginx/html/img:ro
      - ${APP_DATA_DIR}/media/gif:/usr/share/nginx/html/gif:ro
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/api/health || curl -fsS http://127.0.0.1/api/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    x-runtipi:
      is_main: true
      internal_port: 80

x-runtipi:
  schema_version: 2
